name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ubuntu-latest, Python 3.14
    if: >
      !(
        github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]')
      )
      &&
      (
        github.event_name == 'push'
        || github.event_name == 'pull_request'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ci-fast-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Setup conda env
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        environment-file: devtools/conda-envs/test_env.yaml
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
          channel_priority: strict
        create-args: >-
          python=3.14

    - name: Info conda
      shell: bash -l {0}
      run: |
        micromamba activate test
        micromamba info
        micromamba list

    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps

    - name: Test import module
      shell: bash -l {0}
      run: |
        set -euo pipefail
        echo "::group::Importing module from home directory"
        trap 'echo "::endgroup::"' EXIT
        cd
        pwd
        python -c 'import pyunitwizard, argdigest.contrib.pyunitwizard_support; print("PyUnitWizard: {} ArgDigest: {}".format(pyunitwizard.__version__, argdigest.__version__))'

    - name: Check code style
      shell: bash -l {0}
      run: |
        ruff check .
        ruff format --check .

    - name: Run tests
      shell: bash -l {0}
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest --receptor=ci -v --cov-config=.coveragerc --cov=pyunitwizard --cov-report=xml --junitxml=junit.xml --color=yes

    - name: Check coverage
      shell: bash -l {0}
      run: |
        cat ./coverage.xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        verbose: true
        files: ./coverage.xml
        fail_ci_if_error: true
        flags: unittests
        name: codecov-ubuntu-latest-py3.14
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      uses: codecov/test-results-action@v1
      with:
        files: ./junit.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
