name: Build and upload conda packages

on:
  release:
    types: ['released', 'prereleased']

  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag or commit to build
        required: false
        default: ''
      python_versions:
        description: JSON list of Python versions to build
        required: false
        default: '["3.11", "3.12", "3.13"]'

jobs:
  conda_deployment_with_new_tag:
    name: Conda deployment
    runs-on: ubuntu-latest

    steps:
      
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict

          create-args: >-
            python=3.13

      - name: Select variants for a manual recovery run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PYTHON_VERSIONS: ${{ inputs.python_versions }}
        run: |
          {
            echo 'python:'
            jq -r '.[] | "  - \"\(.)\""' <<< "$PYTHON_VERSIONS"
          } > devtools/conda-build/conda_build_config.yaml

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate build
          micromamba info
          micromamba list

      - name: Build and upload the conda packages
        uses: uibcdf/action-build-and-upload-conda-packages@v2.0.0
        with:
          meta_yaml_dir: devtools/conda-build
          mambabuild: false
          user: uibcdf
          label: main
          conda_build_args: --package-format tar.bz2
          platform_linux-64: true
          platform_osx-64: true
          platform_osx-arm64: true
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
