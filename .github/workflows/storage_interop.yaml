name: Quantity storage interoperability

on:
  workflow_dispatch:

jobs:
  storage:
    name: Storage on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out reviewed dependency tools
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: 20628bd5dba6d759669b0d444fe657eb1edad33f
          path: .governance-tools
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/storage_interop_env.yaml
          environment-name: storage
          create-args: python=${{ matrix.python }}
          cache-downloads: true
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
      - name: Check dependency contract
        shell: bash -l {0}
        run: python devtools/check_dependency_routes.py --suite-root .governance-tools
      - name: Install consumer
        shell: bash -l {0}
        run: python -m pip install . --no-deps
      - name: Run full suite with optional providers
        shell: bash -l {0}
        run: python -m pytest --receptor=ci -q tests
      - name: Test installed consumer outside checkout
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage-installed-tests/tests/storage" "$RUNNER_TEMP/storage-installed-tests/tests/dialects" "$RUNNER_TEMP/storage-installed-tests/tests/data"
          cp tests/storage/test_*.py "$RUNNER_TEMP/storage-installed-tests/tests/storage/"
          cp tests/dialects/test_*.py "$RUNNER_TEMP/storage-installed-tests/tests/dialects/"
          cp tests/data/h5msm_quantity_boundary.json "$RUNNER_TEMP/storage-installed-tests/tests/data/"
          cp tests/data/sabueso_activity_quantities.json "$RUNNER_TEMP/storage-installed-tests/tests/data/"
          cp tests/data/gaia_proper_motion.json "$RUNNER_TEMP/storage-installed-tests/tests/data/"
          cp tests/test_storage_optional.py tests/test_quantity_record_empty.py "$RUNNER_TEMP/storage-installed-tests/tests/"
          cp tests/test_record_arrays.py tests/test_record_tagged.py tests/test_record_append.py tests/test_record_extensions_consumer.py "$RUNNER_TEMP/storage-installed-tests/tests/"
          cd "$RUNNER_TEMP/storage-installed-tests"
          python -m pip check
          python -c 'import pathlib, sys, importlib.metadata as m, pyunitwizard, cf_units, h5py, zarr, pyarrow, ucumvert, asdf, asdf_astropy; assert pathlib.Path(pyunitwizard.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); print(pyunitwizard.__file__); print(pyunitwizard.__version__, cf_units.__version__, h5py.__version__, zarr.__version__, pyarrow.__version__); assert m.version("ucumvert") == "0.3.2"; assert m.version("asdf") == "6.0.0"; assert m.version("asdf-astropy") == "0.11.0"; print("UCUM/ASDF providers:", m.version("ucumvert"), m.version("asdf"), m.version("asdf-astropy"))'
          python -m pytest --receptor=ci -q tests --junitxml=installed-contracts.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('installed-contracts.xml').iter('testcase'))
          required = ('test_cf', 'test_ucum', 'test_vocabulary', 'test_hdf5', 'test_zarr',
                      'test_arrow', 'test_asdf', 'test_record_extensions_consumer')
          for module in required:
              selected = [case for case in cases if case.get('classname', '').endswith(module)]
              assert selected, f'No installed guards collected for {module}'
              assert all(case.find('skipped') is None for case in selected), f'Optional guard skipped: {module}'
          PY
