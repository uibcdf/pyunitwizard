name: OpenFF interoperability

on:
  workflow_dispatch:

jobs:
  openff:
    name: OpenFF on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/openff_env.yaml
          environment-name: openff
          create-args: python=${{ matrix.python }}
          cache-downloads: true
      - name: Install consumer
        shell: bash -l {0}
        run: python -m pip install . --no-deps
      - name: Run full suite with optional backend
        shell: bash -l {0}
        run: pytest --receptor=ci -q tests
      - name: Test installed consumer outside checkout
        shell: bash -l {0}
        run: |
          mkdir -p "$RUNNER_TEMP/openff-installed-tests"
          cp tests/forms/test_api_openff_units.py tests/test_openff_optional.py "$RUNNER_TEMP/openff-installed-tests/"
          cd "$RUNNER_TEMP/openff-installed-tests"
          python -m pip check
          python -c 'import pyunitwizard, openff.units, pint; print(pyunitwizard.__file__); print(pyunitwizard.__version__, openff.units.__version__, pint.__version__)'
          pytest --receptor=ci -q .
