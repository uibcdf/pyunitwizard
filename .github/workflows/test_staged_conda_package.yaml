name: Test staged Conda package

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA used by the successful staging build
        required: true
        type: string
      version:
        description: Exact staged version
        required: true
        type: string
      build_number:
        description: Exact staged build number
        required: true
        type: number
      staging_run_id:
        description: Successful staging workflow run with producer receipts
        required: true
        type: number

permissions:
  contents: read
  actions: read

jobs:
  verify-producer:
    name: Verify the immutable producer evidence
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.receipts.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Confirm the verifier comes from the candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Download and verify the exact staging run receipts
        id: receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$RUNNER_TEMP/staging-run.json"
          gh run download "$STAGING_RUN_ID" --dir "$RUNNER_TEMP/staging-evidence"
          sha256="$(python devtools/conda-build/verify_staged_install.py receipts \
            --run "$RUNNER_TEMP/staging-run.json" \
            --evidence-dir "$RUNNER_TEMP/staging-evidence" \
            --sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" \
            --build-number "$BUILD_NUMBER" --run-id "$STAGING_RUN_ID")"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Bind original artifact source to the qualification workflow
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_SHA: ${{ github.sha }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          ARTIFACT_SHA256: ${{ steps.receipts.outputs.sha256 }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          candidate = os.environ['CANDIDATE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == candidate
          binding = {
              'schema': 'pyunitwizard.installed-source@1',
              'candidate_sha': candidate,
              'qualification_sha': os.environ['QUALIFICATION_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'filename': f"pyunitwizard-{os.environ['CANDIDATE_VERSION']}-py_{os.environ['BUILD_NUMBER']}.tar.bz2",
              'sha256': os.environ['ARTIFACT_SHA256'],
              'profiles': {'baseline': ['3.11', '3.12', '3.13', '3.14'],
                           'storage': ['3.11', '3.12', '3.13', '3.14'],
                           'openff': ['3.12', '3.13', '3.14'],
                           'prepared': ['3.11', '3.12', '3.13', '3.14']},
              'platforms': ['ubuntu-latest', 'macos-latest'],
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'installed-source-binding.json').write_text(json.dumps(binding, indent=2) + '\n')
          PY
      - name: Retain original-source qualification binding
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-source-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-source-binding.json
          if-no-files-found: error
          retention-days: 30

  install:
    name: Install ${{ matrix.profile }} / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: verify-producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        profile: [baseline, storage, openff, prepared]
        exclude:
          - {profile: openff, python: "3.11"}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Confirm the install smoke comes from the candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Create a clean environment from the exact staged build
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: candidate
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
            # Staging also contains SMonitor; strict priority masks the public
            # build in libmamba even with an explicit channel qualifier.
            channel_priority: flexible
          create-args: >-
            python=${{ matrix.python }}
            uibcdf/label/staging::pyunitwizard=${{ inputs.version }}=py_${{ inputs.build_number }}
            uibcdf::depdigest=0.11.0=py_2
            uibcdf::smonitor=0.16.0=py_1
            uibcdf::argdigest=0.14.0=py_0
            ${{ matrix.profile == 'prepared' && 'uibcdf::ackredit=0.10.1=py_0' || 'uibcdf::ackredit=0.9.0=py_0' }}
            pip pytest uibcdf::pytest-receptor=1.1.0 openmm unyt astropy
            ${{ matrix.profile == 'storage' && 'cf-units=3.3.1 h5py=3.16.0' || '' }}
            ${{ matrix.profile == 'openff' && 'openff-units=0.4.0 pint>=0.24,<0.26' || '' }}
      - name: Install third-party test backends
        shell: bash -l {0}
        run: |
          python -m pip install physipy quantities
          python -m pip check
      - name: Verify public attribution provider and prepared APIs
        shell: bash -l {0}
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          import ackredit
          version = '0.10.1' if os.environ['PROFILE'] == 'prepared' else '0.9.0'
          filename = f'ackredit-{version}-py_0.tar.bz2'
          prefix = Path(sys.prefix).resolve()
          record = json.loads((prefix / 'conda-meta' / f'ackredit-{version}-py_0.json').read_text())
          assert record['url'] == f'https://conda.anaconda.org/uibcdf/noarch/{filename}'
          assert ackredit.__version__ == version
          assert Path(ackredit.__file__).resolve().is_relative_to(prefix)
          if os.environ['PROFILE'] == 'prepared':
              assert callable(ackredit.prepare_credit)
              assert callable(ackredit.observe_calls)
          PY
      - name: Verify installed artifact and smoke test outside the source checkout
        shell: bash -l {0}
        env:
          EXPECTED_SHA256: ${{ needs.verify-producer.outputs.sha256 }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          checker="$GITHUB_WORKSPACE/devtools/conda-build/verify_staged_install.py"
          cd "$RUNNER_TEMP"
          python "$checker" installed --prefix "$CONDA_PREFIX" \
            --sha256 "$EXPECTED_SHA256" --version "$CANDIDATE_VERSION" \
            --build-number "$BUILD_NUMBER" --python-version "$PYTHON_VERSION"
      - name: Test the installed record and integration contracts
        shell: bash -l {0}
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/installed-contracts"
          mkdir -p "$target/tests/pint" "$target/tests/integration" "$target/tests/forms" "$target/tests/storage" "$target/tests/dialects"
          cp tests/test_quantity_record.py tests/test_quantity_record_empty.py tests/test_measurement_record.py tests/test_configure.py tests/test_openff_optional.py tests/test_storage_optional.py tests/test_backend_declarations.py "$target/tests/"
          cp -r tests/quantity_record_vectors tests/data "$target/tests/"
          cp tests/pint/test_foreign_registry.py tests/pint/test_string_array_roundtrip.py "$target/tests/pint/"
          cp tests/integration/test_backend_attribution.py "$target/tests/integration/"
          if [[ "$PROFILE" == storage ]]; then
            cp tests/storage/test_hdf5.py "$target/tests/storage/"
            cp tests/dialects/test_cf.py "$target/tests/dialects/"
          elif [[ "$PROFILE" == openff ]]; then
            cp tests/forms/test_api_openff_units.py "$target/tests/forms/"
          elif [[ "$PROFILE" == prepared ]]; then
            cp tests/integration/test_function_citation_provider.py "$target/tests/integration/"
          fi
          cd "$target"
          python -c 'import pathlib, sys, pyunitwizard; assert pathlib.Path(pyunitwizard.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); print(pyunitwizard.__version__)'
          python -m pytest --receptor=ci -q tests -k 'not normally_installed_consumer_outside_checkout' --junitxml=installed-contracts.xml
          if [[ "$PROFILE" == prepared ]]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('installed-contracts.xml').iter('testcase'))
          attribution = [case for case in cases if any(
              case.get('classname', '').endswith(module) for module in (
                  'test_backend_declarations', 'test_backend_attribution', 'test_function_citation_provider'))]
          assert attribution, 'No attribution guards collected'
          assert any(case.get('name', '').startswith('test_warmed_prepared_conversion_does_not_detach_declarations_again') for case in attribution)
          assert any(case.get('name') == 'test_saved_own_reference_survives_reader_without_producer' for case in attribution)
          assert all(case.find('skipped') is None for case in attribution), 'Prepared attribution guard skipped'
          PY
          fi
          cp installed-contracts.xml "$RUNNER_TEMP/installed-contracts.xml"
      - name: Retain the installed dependency closure
        if: success()
        shell: bash -l {0}
        run: |
          micromamba list --json > "$RUNNER_TEMP/installed-closure.json"
          python -m pip list --format=json > "$RUNNER_TEMP/pip-closure.json"
      - name: Upload installed dependency evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: closure-${{ matrix.profile }}-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/installed-closure.json
            ${{ runner.temp }}/pip-closure.json
            ${{ runner.temp }}/installed-contracts.xml
          if-no-files-found: error
          retention-days: 30
