package:
  name: pyunitwizard
  version: "{{ environ['GIT_DESCRIBE_TAG'] }}"
source:
  path: ../../
build:
  number: "{{ environ.get('PYUNITWIZARD_CONDA_BUILD_NUMBER', '0') }}"
  noarch: python
requirements:
  host:
  - python >=3.11,<3.15
  - pip
  - setuptools >=77.0.3
  - versioningit >=3.0
  run:
  - python >=3.11,<3.15
  - numpy >=1.23.5
  - pint >=0.25
  - smonitor >=0.16.0
  - depdigest >=0.11.0
  - argdigest >=0.14.0
test:
  imports:
  - pyunitwizard
  commands:
  - python -c "import importlib.metadata as m; import os; import pyunitwizard as puw; assert m.version('pyunitwizard') == os.environ['PKG_VERSION']; assert puw.__version__ == os.environ['PKG_VERSION']; assert puw.get_value(puw.quantity(1.0, 'nm')) == 1.0"
about:
  home: https://uibcdf.org
  license: MIT AND CC-BY-4.0
  license_file:
  - LICENSE
  - pyunitwizard/vocabularies/NOTICE.md
  summary: ''
  description: 'This library provides some useful methods to work with quantities

    '
  dev_url: https://github.com/uibcdf/pyunitwizard
  doc_url: https://uibcdf.org/pyunitwizard
